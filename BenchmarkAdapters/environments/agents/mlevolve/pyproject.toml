[project]
name = "mlevolve-control-plane"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "backoff==2.2.1",
  "black==24.3.0",
  "coolname==2.2.0",
  "dataclasses-json==0.6.7",
  "flask==3.0.3",
  "funcy==2.0",
  "genson==1.3.0",
  "google-genai==1.51.0",
  "google-generativeai==0.8.4",
  "humanize==4.8.0",
  "jsonschema==4.25.1",
  "matplotlib==3.10.1",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "openai==1.66.3",
  "pandas==2.3.1",
  "rank-bm25==0.2.2",
  "requests==2.32.5",
  "rich==13.7.0",
  "scipy==1.16.2",
  "seaborn==0.13.2",
  "shutup==0.2.0",
  "torch==2.6.0",
  "mle-bench-lite-local",
]

[dependency-groups]
test = [
  "pytest>=8.4,<9",
]

[tool.uv]
package = false

[tool.uv.sources]
mle-bench-lite-local = { path = "../../../../mle-bench-lite" }
