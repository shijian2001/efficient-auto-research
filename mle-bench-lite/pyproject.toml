[project]
name = "mle-bench-lite-local"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "catboost>=1.2,<2",
  "lightgbm>=4.5,<5",
  "librosa>=0.10,<1",
  "mlebench",
  "numpy==1.26.4",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "torchvision==0.21.0",
  "transformers>=4.44,<5",
  "xgboost>=2.1,<4",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv.sources]
mlebench = { path = "../mle-bench" }
