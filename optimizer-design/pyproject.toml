[project]
name = "optimizer-design-benchmark"
version = "0.1.0"
description = "Locked runtime for the modded-NanoGPT Track 3 reconstruction"
requires-python = ">=3.10,<3.11"
dependencies = [
  "huggingface-hub==1.26.0",
  "numpy==2.2.6",
  "torch==2.11.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
